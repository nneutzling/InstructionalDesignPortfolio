document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e320edf7-979a-4a40-9e8c-a28e88827ab9\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* ============================================================\n   PEAK webfonts — self-hosted (official binaries)\n   Jost  : headers (700), sub-headers (400), numbers (700)\n   Aleo  : body (400 / 700)\n   Fallbacks per toolkit: Helvetica Neue (sans) + Georgia (serif)\n   ============================================================ */\n\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4a4ea5b2-1d6b-4df3-b7a0-18f3cb2fc280\") format('truetype');\n}\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"781cf196-d040-4ef1-b239-bb1c1cbc1a80\") format('truetype');\n}\n@font-face {\n  font-family: 'Aleo';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b5f8fed4-bca0-413b-b53e-4c3a128ff755\") format('truetype');\n}\n@font-face {\n  font-family: 'Aleo';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"73e6db57-793d-4b1c-bc6e-8aa3ce067576\") format('truetype');\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   PEAK — COLOURS\n   Primary scheme + secondary shades/tints from the\n   PEAK Visual Language Toolkit. Colours build wayfinding:\n   Blue = PMP / correct, Yellow = CAPM / highlights,\n   Red = Agile / risk / incorrect, Teal = Waterfall / complete.\n   ============================================================ */\n\n:root {\n  /* ---- Brand primaries (raw) ---- */\n  --peak-blue:       #133A54;  /* PMP, primary, correct answers, general elements */\n  --peak-blue-dark:  #0E2C40;  /* video intro background (use at 90% opacity) */\n  --peak-yellow:     #EBC703;  /* CAPM, arrows, directional highlights */\n  --peak-teal:       #03C3C8;  /* Waterfall graphics, completed projects */\n  --peak-red:        #E3635C;  /* Agile graphics, incorrect answers, risk */\n\n  /* ---- Neutrals ---- */\n  --peak-black:      #14181B;  /* text, general backgrounds */\n  --peak-white:      #FFFFFF;\n  --gray-900:        #14181B;\n  --gray-700:        #3F484E;\n  --gray-500:        #6B757C;  /* medium gray — general graphics */\n  --gray-400:        #97A1A8;  /* medium gray (light) */\n  --gray-300:        #C5CCD0;\n  --gray-200:        #E2E6E9;  /* light gray — general backgrounds */\n  --gray-100:        #EFF2F3;\n  --gray-050:        #F7F9FA;\n\n  /* ---- Tints (for fills / wash backgrounds) ---- */\n  --blue-tint:       #E3E9ED;  /* peak-blue @ ~12% over white */\n  --yellow-tint:     #FCF4CC;\n  --teal-tint:       #D6F4F5;\n  --red-tint:        #F9E0DF;\n\n  /* ============================================================\n     SEMANTIC ALIASES\n     ============================================================ */\n\n  /* Surfaces & text */\n  --surface-page:      var(--peak-white);\n  --surface-card:      var(--peak-white);\n  --surface-sunken:    var(--gray-100);\n  --surface-muted:     var(--gray-200);\n  --surface-inverse:   var(--peak-blue);\n  --surface-inverse-2: var(--peak-blue-dark);\n\n  --text-strong:    var(--peak-black);\n  --text-body:      #20272C;\n  --text-muted:     var(--gray-500);\n  --text-on-dark:   var(--peak-white);\n  --text-on-yellow: var(--peak-black);\n\n  /* Brand roles */\n  --brand-pmp:        var(--peak-blue);\n  --brand-capm:       var(--peak-yellow);\n  --brand-agile:      var(--peak-red);\n  --brand-waterfall:  var(--peak-teal);\n\n  /* Functional / status (mapped to brand wayfinding) */\n  --status-correct:   var(--peak-blue);\n  --status-incorrect: var(--peak-red);\n  --status-risk:      var(--peak-red);\n  --status-highlight: var(--peak-yellow);\n  --status-complete:  var(--peak-teal);\n\n  /* Lines & borders */\n  --border-subtle:  var(--gray-200);\n  --border-default: var(--gray-300);\n  --border-strong:  var(--peak-blue);\n\n  /* Accent used for arrows / directional flow */\n  --accent-arrow:   var(--peak-yellow);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   PEAK — TYPOGRAPHY\n   Headers      : Jost Bold,    ALL CAPS, 100 tracking (.1em)\n   Sub-headers  : Jost Regular, ALL CAPS, 200 tracking (.2em)\n   Body copy    : Aleo Regular, sentence/lowercase, 0 tracking\n   Numbers/stats: Jost Bold, 0 tracking (never tracked)\n   Fallbacks    : Helvetica Neue (sans) + Georgia (serif)\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n  --font-sans:    'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n  --font-body:    'Aleo', Georgia, 'Times New Roman', serif;\n  --font-number:  'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n\n  /* ---- Weights ---- */\n  --fw-regular:  400; /* @kind other */\n  --fw-medium:   500; /* @kind other */\n  --fw-semibold: 600; /* @kind other */\n  --fw-bold:     700; /* @kind other */  /* headers + numbers. Jost Black is NOT used. */\n\n  /* ---- Tracking (Illustrator units → em: 1000 = 1em) ---- */\n  --track-header:    0.10em; /* @kind other */  /* 100 */\n  --track-subheader: 0.20em; /* @kind other */  /* 200 */\n  --track-body:      0; /* @kind other */\n  --track-number:    0; /* @kind other */  /* numbers & stats are never tracked */\n\n  /* ---- Type scale (display sizes) ---- */\n  --text-display:  clamp(2.5rem, 5vw, 4rem);   /* 40–64 */\n  --text-h1:       2.5rem;    /* 40 */\n  --text-h2:       2rem;      /* 32 */\n  --text-h3:       1.5rem;    /* 24 */\n  --text-h4:       1.25rem;   /* 20 */\n  --text-sub:      1rem;      /* 16 sub-header */\n  --text-base:     1rem;      /* 16 body */\n  --text-sm:       0.875rem;  /* 14 */\n  --text-xs:       0.75rem;   /* 12 — minimum legible body size */\n\n  /* ---- Line heights ---- */\n  --leading-tight:  1.05;   /* big headers */\n  --leading-snug:   1.2;\n  --leading-normal: 1.5;    /* body copy */\n  --leading-relaxed:1.65;\n}\n\n/* ============================================================\n   ROLE CLASSES — apply the rules directly\n   ============================================================ */\n\n.peak-header {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  text-transform: uppercase;\n  letter-spacing: var(--track-header);\n  line-height: var(--leading-tight);\n  color: var(--text-strong);\n}\n\n.peak-subheader {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  text-transform: uppercase;\n  letter-spacing: var(--track-subheader);\n  line-height: var(--leading-snug);\n  color: var(--text-strong);\n}\n\n.peak-body {\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  letter-spacing: var(--track-body);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n}\n\n.peak-number {\n  font-family: var(--font-number);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--track-number);\n  font-feature-settings: 'tnum' 1;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   PEAK — SPACING, RADII, SHADOWS, MOTION\n   The brand is geometric and clean: small radii, restrained\n   shadows. Triangles/chevrons carry directional flow, not\n   heavy elevation. Shadows are reserved (e.g. milestone\n   triangle \"with shadow\").\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (8px base) ---- */\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   24px;\n  --space-6:   32px;\n  --space-7:   48px;\n  --space-8:   64px;\n  --space-9:   96px;\n  --space-10:  128px;\n\n  /* ---- Radii — geometric, minimal. Icons use slightly rounded corners. ---- */\n  --radius-none: 0;\n  --radius-xs:   2px;\n  --radius-sm:   4px;\n  --radius-md:   6px;\n  --radius-lg:   10px;\n  --radius-pill: 999px;\n\n  /* ---- Border widths ---- */\n  --bw-hair:   1px;\n  --bw-1:      1.5px;\n  --bw-2:      2px;\n  --bw-3:      3px;\n\n  /* ---- Shadows (reserved, soft, cool-cast toward navy) ---- */\n  --shadow-none: none;\n  --shadow-sm:  0 1px 2px rgba(19, 58, 84, 0.08);\n  --shadow-md:  0 4px 14px rgba(19, 58, 84, 0.10);\n  --shadow-lg:  0 12px 32px rgba(19, 58, 84, 0.14);\n  /* milestone / chevron drop — slightly directional */\n  --shadow-milestone: 4px 6px 0 rgba(19, 58, 84, 0.18);\n\n  /* ---- Layout ---- */\n  --container-sm:  640px;\n  --container-md:  960px;\n  --container-lg:  1200px;\n  --container-xl:  1440px;\n\n  /* video / overlay safe space (keep captions clear of playbars) */\n  --safe-space: 56px;\n\n  /* ---- Motion — fades + directional slides, no bounce ---- */\n  --ease-standard: cubic-bezier(0.4, 0.0, 0.2, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0.0, 0.0, 0.2, 1); /* @kind other */\n  --ease-in:       cubic-bezier(0.4, 0.0, 1, 1); /* @kind other */\n  --dur-fast:   140ms; /* @kind other */\n  --dur-base:   220ms; /* @kind other */\n  --dur-slow:   360ms; /* @kind other */\n\n  /* overlay opacity floor from video guidelines (never lower than 90%) */\n  --overlay-opacity: 0.90; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   PEAK Design System — global entry point.\n   Consumers link THIS file. Keep it as @import lines only.\n   ============================================================ */\n\n/* ============================================================\n   PEAK webfonts — self-hosted (official binaries)\n   Jost  : headers (700), sub-headers (400), numbers (700)\n   Aleo  : body (400 / 700)\n   Fallbacks per toolkit: Helvetica Neue (sans) + Georgia (serif)\n   ============================================================ */\n\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4a4ea5b2-1d6b-4df3-b7a0-18f3cb2fc280\") format('truetype');\n}\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"781cf196-d040-4ef1-b239-bb1c1cbc1a80\") format('truetype');\n}\n@font-face {\n  font-family: 'Aleo';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"b5f8fed4-bca0-413b-b53e-4c3a128ff755\") format('truetype');\n}\n@font-face {\n  font-family: 'Aleo';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"73e6db57-793d-4b1c-bc6e-8aa3ce067576\") format('truetype');\n}\n\n/* ============================================================\n   PEAK — COLOURS\n   Primary scheme + secondary shades/tints from the\n   PEAK Visual Language Toolkit. Colours build wayfinding:\n   Blue = PMP / correct, Yellow = CAPM / highlights,\n   Red = Agile / risk / incorrect, Teal = Waterfall / complete.\n   ============================================================ */\n\n:root {\n  /* ---- Brand primaries (raw) ---- */\n  --peak-blue:       #133A54;  /* PMP, primary, correct answers, general elements */\n  --peak-blue-dark:  #0E2C40;  /* video intro background (use at 90% opacity) */\n  --peak-yellow:     #EBC703;  /* CAPM, arrows, directional highlights */\n  --peak-teal:       #03C3C8;  /* Waterfall graphics, completed projects */\n  --peak-red:        #E3635C;  /* Agile graphics, incorrect answers, risk */\n\n  /* ---- Neutrals ---- */\n  --peak-black:      #14181B;  /* text, general backgrounds */\n  --peak-white:      #FFFFFF;\n  --gray-900:        #14181B;\n  --gray-700:        #3F484E;\n  --gray-500:        #6B757C;  /* medium gray — general graphics */\n  --gray-400:        #97A1A8;  /* medium gray (light) */\n  --gray-300:        #C5CCD0;\n  --gray-200:        #E2E6E9;  /* light gray — general backgrounds */\n  --gray-100:        #EFF2F3;\n  --gray-050:        #F7F9FA;\n\n  /* ---- Tints (for fills / wash backgrounds) ---- */\n  --blue-tint:       #E3E9ED;  /* peak-blue @ ~12% over white */\n  --yellow-tint:     #FCF4CC;\n  --teal-tint:       #D6F4F5;\n  --red-tint:        #F9E0DF;\n\n  /* ============================================================\n     SEMANTIC ALIASES\n     ============================================================ */\n\n  /* Surfaces & text */\n  --surface-page:      var(--peak-white);\n  --surface-card:      var(--peak-white);\n  --surface-sunken:    var(--gray-100);\n  --surface-muted:     var(--gray-200);\n  --surface-inverse:   var(--peak-blue);\n  --surface-inverse-2: var(--peak-blue-dark);\n\n  --text-strong:    var(--peak-black);\n  --text-body:      #20272C;\n  --text-muted:     var(--gray-500);\n  --text-on-dark:   var(--peak-white);\n  --text-on-yellow: var(--peak-black);\n\n  /* Brand roles */\n  --brand-pmp:        var(--peak-blue);\n  --brand-capm:       var(--peak-yellow);\n  --brand-agile:      var(--peak-red);\n  --brand-waterfall:  var(--peak-teal);\n\n  /* Functional / status (mapped to brand wayfinding) */\n  --status-correct:   var(--peak-blue);\n  --status-incorrect: var(--peak-red);\n  --status-risk:      var(--peak-red);\n  --status-highlight: var(--peak-yellow);\n  --status-complete:  var(--peak-teal);\n\n  /* Lines & borders */\n  --border-subtle:  var(--gray-200);\n  --border-default: var(--gray-300);\n  --border-strong:  var(--peak-blue);\n\n  /* Accent used for arrows / directional flow */\n  --accent-arrow:   var(--peak-yellow);\n}\n\n/* ============================================================\n   PEAK — TYPOGRAPHY\n   Headers      : Jost Bold,    ALL CAPS, 100 tracking (.1em)\n   Sub-headers  : Jost Regular, ALL CAPS, 200 tracking (.2em)\n   Body copy    : Aleo Regular, sentence/lowercase, 0 tracking\n   Numbers/stats: Jost Bold, 0 tracking (never tracked)\n   Fallbacks    : Helvetica Neue (sans) + Georgia (serif)\n   ============================================================ */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n  --font-sans:    'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n  --font-body:    'Aleo', Georgia, 'Times New Roman', serif;\n  --font-number:  'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;\n\n  /* ---- Weights ---- */\n  --fw-regular:  400; /* @kind other */\n  --fw-medium:   500; /* @kind other */\n  --fw-semibold: 600; /* @kind other */\n  --fw-bold:     700; /* @kind other */  /* headers + numbers. Jost Black is NOT used. */\n\n  /* ---- Tracking (Illustrator units → em: 1000 = 1em) ---- */\n  --track-header:    0.10em; /* @kind other */  /* 100 */\n  --track-subheader: 0.20em; /* @kind other */  /* 200 */\n  --track-body:      0; /* @kind other */\n  --track-number:    0; /* @kind other */  /* numbers & stats are never tracked */\n\n  /* ---- Type scale (display sizes) ---- */\n  --text-display:  clamp(2.5rem, 5vw, 4rem);   /* 40–64 */\n  --text-h1:       2.5rem;    /* 40 */\n  --text-h2:       2rem;      /* 32 */\n  --text-h3:       1.5rem;    /* 24 */\n  --text-h4:       1.25rem;   /* 20 */\n  --text-sub:      1rem;      /* 16 sub-header */\n  --text-base:     1rem;      /* 16 body */\n  --text-sm:       0.875rem;  /* 14 */\n  --text-xs:       0.75rem;   /* 12 — minimum legible body size */\n\n  /* ---- Line heights ---- */\n  --leading-tight:  1.05;   /* big headers */\n  --leading-snug:   1.2;\n  --leading-normal: 1.5;    /* body copy */\n  --leading-relaxed:1.65;\n}\n\n/* ============================================================\n   ROLE CLASSES — apply the rules directly\n   ============================================================ */\n\n.peak-header {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  text-transform: uppercase;\n  letter-spacing: var(--track-header);\n  line-height: var(--leading-tight);\n  color: var(--text-strong);\n}\n\n.peak-subheader {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  text-transform: uppercase;\n  letter-spacing: var(--track-subheader);\n  line-height: var(--leading-snug);\n  color: var(--text-strong);\n}\n\n.peak-body {\n  font-family: var(--font-body);\n  font-weight: var(--fw-regular);\n  letter-spacing: var(--track-body);\n  line-height: var(--leading-normal);\n  color: var(--text-body);\n}\n\n.peak-number {\n  font-family: var(--font-number);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--track-number);\n  font-feature-settings: 'tnum' 1;\n}\n\n/* ============================================================\n   PEAK — SPACING, RADII, SHADOWS, MOTION\n   The brand is geometric and clean: small radii, restrained\n   shadows. Triangles/chevrons carry directional flow, not\n   heavy elevation. Shadows are reserved (e.g. milestone\n   triangle \"with shadow\").\n   ============================================================ */\n\n:root {\n  /* ---- Spacing scale (8px base) ---- */\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   24px;\n  --space-6:   32px;\n  --space-7:   48px;\n  --space-8:   64px;\n  --space-9:   96px;\n  --space-10:  128px;\n\n  /* ---- Radii — geometric, minimal. Icons use slightly rounded corners. ---- */\n  --radius-none: 0;\n  --radius-xs:   2px;\n  --radius-sm:   4px;\n  --radius-md:   6px;\n  --radius-lg:   10px;\n  --radius-pill: 999px;\n\n  /* ---- Border widths ---- */\n  --bw-hair:   1px;\n  --bw-1:      1.5px;\n  --bw-2:      2px;\n  --bw-3:      3px;\n\n  /* ---- Shadows (reserved, soft, cool-cast toward navy) ---- */\n  --shadow-none: none;\n  --shadow-sm:  0 1px 2px rgba(19, 58, 84, 0.08);\n  --shadow-md:  0 4px 14px rgba(19, 58, 84, 0.10);\n  --shadow-lg:  0 12px 32px rgba(19, 58, 84, 0.14);\n  /* milestone / chevron drop — slightly directional */\n  --shadow-milestone: 4px 6px 0 rgba(19, 58, 84, 0.18);\n\n  /* ---- Layout ---- */\n  --container-sm:  640px;\n  --container-md:  960px;\n  --container-lg:  1200px;\n  --container-xl:  1440px;\n\n  /* video / overlay safe space (keep captions clear of playbars) */\n  --safe-space: 56px;\n\n  /* ---- Motion — fades + directional slides, no bounce ---- */\n  --ease-standard: cubic-bezier(0.4, 0.0, 0.2, 1); /* @kind other */\n  --ease-out:      cubic-bezier(0.0, 0.0, 0.2, 1); /* @kind other */\n  --ease-in:       cubic-bezier(0.4, 0.0, 1, 1); /* @kind other */\n  --dur-fast:   140ms; /* @kind other */\n  --dur-base:   220ms; /* @kind other */\n  --dur-slow:   360ms; /* @kind other */\n\n  /* overlay opacity floor from video guidelines (never lower than 90%) */\n  --overlay-opacity: 0.90; /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"e79f1664-95d3-4e12-a3c4-ed8ca4a10582\"><\u002Fscript>\n<script src=\"04c68187-704c-4e58-b412-b5ce4544171b\"><\u002Fscript>\n<script src=\"5862aa81-94d0-4c33-be4d-e28d91a5385a\"><\u002Fscript>\n<style>\n  html, body { margin: 0; padding: 0; background: #F2F4F5; }\n  a { color: #14181B; text-decoration: underline; text-underline-offset: 3px; }\n  a:hover { color: #4A5560; }\n  body, input { font-family: var(--font-sans); }\n  input::placeholder { color: rgba(255,255,255,0.4); }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"height: 100vh; overflow: hidden; background: #F2F4F5; font-family: var(--font-sans); color: #14181B; display: flex; flex-direction: column;\">\n\n  <header style=\"flex: none; padding: clamp(10px, 1.6vh, 20px) 44px; display: flex; align-items: center; justify-content: space-between; gap: 24px; background: #303030;\">\n    <div style=\"display: flex; align-items: center; gap: 20px;\">\n      <img src=\"ea957d20-bbe3-4119-b1d2-fac739d9cbdc\" alt=\"PEAK PM Prep\" style=\"height: 64px; width: 70px; display: block; object-fit: cover\">\n      <span style=\"width: 1px; height: 26px; background: rgba(255,255,255,0.22);\"><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 16px;\">\n      <span style=\"font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.6);\">PORTFOLIO SAMPLE · PMP PRACTICE QUIZ<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"flex: 1; min-height: 0; display: flex; justify-content: center; padding: clamp(12px, 3.4vh, 52px) 24px clamp(12px, 3vh, 44px);\">\n\n    <sc-if value=\"{{ isIntro }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width: 100%; max-width: 760px; max-height: 100%; overflow: auto; display: flex; flex-direction: column; justify-content: center; gap: clamp(20px, 3.4vh, 34px);\">\n        <div style=\"display: flex; flex-direction: column; gap: clamp(10px, 1.6vh, 16px);\">\n          \n          <h1 style=\"margin: 0; font-family: var(--font-sans); font-weight: 700; font-size: clamp(32px, 4.6vh, 50px); line-height: 1.02; letter-spacing: 0.03em; text-transform: uppercase; color: #14181B;\">PMP PRACTICE SAMPLE<\u002Fh1>\n          \n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: rgba(20,24,27,0.14); border: 1px solid rgba(20,24,27,0.14);\">\n          <div style=\"background: #FFFFFF; padding: 24px 26px; display: flex; flex-direction: column; gap: 6px; border-top: 3px solid #303030;\">\n            <span style=\"font-family: var(--font-sans); font-weight: 700; font-size: 40px; line-height: 1; color: #14181B;\">8<\u002Fspan>\n            <span style=\"font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(20,24,27,0.55);\">Questions, one per screen<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background: #FFFFFF; padding: 24px 26px; display: flex; flex-direction: column; gap: 6px; border-top: 3px solid #303030;\">\n            <span style=\"font-family: var(--font-sans); font-weight: 700; font-size: 40px; line-height: 1; color: #14181B;\">∞<\u002Fspan>\n            <span style=\"font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(20,24,27,0.55);\">Attempts<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: 24px; flex-wrap: wrap;\">\n          <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ start }}\" sc-camel-on-mouse-enter=\"{{ solidIn }}\" sc-camel-on-mouse-leave=\"{{ solidOut }}\" style=\"font-family: var(--font-sans); font-weight: 700; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; background: #303030; color: #FFFFFF; padding: 16px 30px; border-radius: 2px; cursor: pointer; transition: background 160ms cubic-bezier(.4,0,.2,1);\">START THE QUIZ<\u002Fdiv>\n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width: 100%; max-width: 860px; height: 100%; min-height: 0; display: flex; flex-direction: column; gap: clamp(14px, 2.2vh, 26px);\">\n\n        <div style=\"flex: none; display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: nowrap; white-space: nowrap;\">\n            <span style=\"font-family: var(--font-sans); font-weight: 700; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #14181B;\">Question {{ humanIndex }} of {{ total }}<\u002Fspan>\n            <span style=\"font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(20,24,27,0.5);\">{{ answeredCount }} answered<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 4px;\">\n            <sc-for list=\"{{ segments }}\" as=\"seg\" hint-placeholder-count=\"20\">\n              <div style=\"height: 5px; flex: 1; background: {{ seg.bg }};\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex: 1; min-height: 0; overflow: auto; background: #FFFFFF; border: 1px solid rgba(20,24,27,0.12); border-top: 3px solid #303030; padding: clamp(14px, 3vh, 34px) clamp(16px, 2.4vw, 38px); display: flex; flex-direction: column; gap: clamp(12px, 2.6vh, 26px);\">\n          <sc-if value=\"{{ isMulti }}\" hint-placeholder-val=\"{{ false }}\">\n            \n          <\u002Fsc-if>\n\n          <p style=\"margin: 0; font-size: clamp(14px, 1.9vh, 19px); line-height: 1.5; color: #14181B; text-wrap: pretty;\">{{ q.stem }}<\u002Fp>\n\n          <div style=\"display: flex; flex-direction: column; gap: clamp(6px, 1vh, 10px);\">\n            <sc-for list=\"{{ choices }}\" as=\"opt\" hint-placeholder-count=\"4\">\n              <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ opt.pick }}\" sc-camel-on-key-down=\"{{ opt.key }}\" sc-camel-on-mouse-enter=\"{{ opt.enter }}\" sc-camel-on-mouse-leave=\"{{ opt.leave }}\" style=\"display: flex; gap: 14px; align-items: center; padding: clamp(8px, 1.5vh, 16px) 16px; cursor: pointer; border: 1.5px solid {{ opt.border }}; background: {{ opt.bg }}; color: #14181B; border-radius: 2px; transition: border-color 160ms cubic-bezier(.4,0,.2,1), background 160ms cubic-bezier(.4,0,.2,1);\">\n                <span style=\"flex: none; width: 28px; height: 28px; display: grid; place-items: center; font-family: var(--font-sans); font-weight: 700; font-size: 13px; border-radius: {{ opt.badgeRadius }}; color: {{ opt.badgeColor }}; background: {{ opt.badgeBg }}; border: 1.5px solid {{ opt.badgeBorder }};\">{{ opt.letter }}<\u002Fspan>\n                <span style=\"font-size: clamp(14px, 1.9vh, 19px); line-height: 1.4;\">{{ opt.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n          <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ back }}\" sc-camel-on-mouse-enter=\"{{ ghostIn }}\" sc-camel-on-mouse-leave=\"{{ ghostOut }}\" style=\"font-family: var(--font-sans); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; padding: clamp(10px, 1.5vh, 14px) 22px; border: 1.5px solid rgba(20,24,27,0.22); border-radius: 2px; color: {{ backColor }}; cursor: {{ backCursor }}; transition: background 160ms cubic-bezier(.4,0,.2,1);\">Back<\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 20px;\">\n            <sc-if value=\"{{ unansweredNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size: 13px; color: var(--peak-red);\">{{ unansweredNote }}<\u002Fspan>\n            <\u002Fsc-if>\n            <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ next }}\" sc-camel-on-mouse-enter=\"{{ solidIn }}\" sc-camel-on-mouse-leave=\"{{ solidOut }}\" style=\"font-family: var(--font-sans); font-weight: 700; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; background: {{ nextBg }}; color: {{ nextInk }}; padding: clamp(11px, 1.7vh, 16px) 30px; border-radius: 2px; cursor: {{ nextCursor }}; transition: background 160ms cubic-bezier(.4,0,.2,1);\">{{ nextLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width: 100%; max-width: 760px; max-height: 100%; overflow: auto; display: flex; flex-direction: column; justify-content: center; gap: clamp(16px, 2.6vh, 28px);\">\n\n        <div style=\"flex: none; border: 1px solid rgba(20,24,27,0.12); border-top: 3px solid #303030; background: #FFFFFF; padding: clamp(24px, 4vh, 46px) clamp(24px, 3vw, 42px); display: flex; flex-direction: column; gap: 20px;\">\n          <span style=\"font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(20,24,27,0.55);\">SAMPLE RESULTS<\u002Fspan>\n          <span style=\"font-family: var(--font-sans); font-weight: 700; font-size: clamp(58px, 9vh, 96px); line-height: 0.84; color: #14181B;\">{{ percentLabel }}<\u002Fspan>\n          \n        <\u002Fdiv>\n\n        <div style=\"flex: none; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;\">\n          <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ doExit }}\" sc-camel-on-mouse-enter=\"{{ solidIn }}\" sc-camel-on-mouse-leave=\"{{ solidOut }}\" style=\"font-family: var(--font-sans); font-weight: 700; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; background: #303030; color: #FFFFFF; padding: 15px 30px; border-radius: 2px; cursor: pointer; transition: background 160ms cubic-bezier(.4,0,.2,1);\">Try again<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  \n\n  <footer style=\"flex: none; padding: clamp(10px, 1.6vh, 20px) 44px; background: #303030; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; font-size: 12px; color: rgba(255,255,255,0.5);\">\n    <span><br><\u002Fspan>\n    <div style=\"display: flex; align-items: center; gap: 14px;\">\n      \n      <sc-if value=\"{{ resetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; align-items: center; gap: 8px;\">\n          <input type=\"password\" placeholder=\"Instructor key\" value=\"{{ pw }}\" sc-camel-on-change=\"{{ onPw }}\" sc-camel-on-key-down=\"{{ pwKey }}\" sc-camel-auto-focus=\"{{ true }}\" style=\"background: #1E2124; border: 1px solid {{ pwBorder }}; border-radius: 2px; color: #FFFFFF; font-size: 12px; padding: 6px 10px; width: 132px; outline: none;\">\n          <span sc-camel-on-click=\"{{ doReset }}\" style=\"font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.75); cursor: pointer;\" style-hover=\"color: #FFFFFF;\">Reset<\u002Fspan>\n          <span sc-camel-on-click=\"{{ closeReset }}\" style=\"cursor: pointer; color: rgba(255,255,255,0.45);\" style-hover=\"color: #FFFFFF;\">×<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <span sc-camel-on-click=\"{{ toggleReset }}\" title=\"Instructor reset\" style=\"width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.22); cursor: pointer; flex: none;\" style-hover=\"background: rgba(255,255,255,0.6);\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;program&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;PMP&quot;, &quot;CAPM&quot;], &quot;default&quot;: &quot;PMP&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Branding&quot;}, &quot;instructorPassword&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;e2e59acddf09d82a099ddf035aff83aa&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Instructor&quot;}, &quot;shuffleQuestions&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Quiz behavior&quot;}}\">\nconst STORE = 'peak-baseline-week0-gray';\nconst INK = '#303030';\n\nclass Component extends DCLogic {\n  state = {\n    screen: 'intro', learnerName: '',\n    index: 0, answers: {}, result: null,\n    lms: { connected: false, version: 'none' },\n    resetOpen: false, pw: '', pwError: '', nudge: false, hover: null, exited: false\n  };\n\n  get bank() {\n    const raw = (typeof window !== 'undefined' && window.PEAK_BASELINE) || [];\n    return this.props.shuffleQuestions ? this.shuffled(raw) : raw;\n  }\n\n  shuffled(list) {\n    if (!this._order || this._order.length !== list.length) {\n      this._order = list.map((_, i) => i);\n      for (let i = this._order.length - 1; i > 0; i--) {\n        const j = Math.floor(Math.random() * (i + 1));\n        [this._order[i], this._order[j]] = [this._order[j], this._order[i]];\n      }\n    }\n    return this._order.map(i => list[i]).filter(Boolean);\n  }\n\n  get program() { return (this.props.program === 'CAPM') ? 'CAPM' : 'PMP'; }\n\n  componentDidMount() {\n    const scorm = window.PeakSCORM;\n    if (scorm) scorm.init();\n    let saved = null;\n    saved = null; /* portfolio sample: always start fresh */\n    const resumed = scorm && scorm.resume && scorm.resume();\n    const done = (saved && saved.submitted) || (resumed && resumed.submitted);\n    const next = { lms: { connected: !!(scorm && scorm.connected), version: scorm ? scorm.version : 'none' } };\n    if (done) {\n      const src = (saved && saved.submitted) ? saved : resumed;\n      next.screen = 'results';\n      next.result = { percent: src.percent, correct: src.correct, total: src.total || this.bank.length };\n      next.learnerName = (src.learner && src.learner.name) || '';\n    } else {\n      let prog = null;\n      prog = null;\n      if (prog && prog.answers) { next.answers = prog.answers; next.index = prog.index || 0; }\n    }\n    if (scorm && scorm.learnerName) next.learnerName = next.learnerName || scorm.learnerName();\n    this.setState(next);\n  }\n\n  start = () => this.setState({ screen: 'quiz' });\n\n  complete(q, picked) {\n    const n = (picked || []).length;\n    return q.type === 'MR' ? (q.pickCount ? n === q.pickCount : n >= 1) : n === 1;\n  }\n\n  pick(q, letter) {\n    this.setState(s => {\n      const cur = s.answers[q.id] || [];\n      let next;\n      if (q.type === 'MR') {\n        next = cur.includes(letter) ? cur.filter(l => l !== letter) : cur.concat(letter);\n        if (q.pickCount && next.length > q.pickCount) next = next.slice(next.length - q.pickCount);\n      } else {\n        next = [letter];\n      }\n      return { answers: { ...s.answers, [q.id]: next.slice().sort() }, nudge: false };\n    });\n  }\n\n  back = () => this.setState(s => ({ index: Math.max(0, s.index - 1), nudge: false, hover: null }));\n\n  saveProgress(index, answers) {\n    try {\n      localStorage.setItem(STORE + ':progress', JSON.stringify({ index: index, answers: answers }));\n    } catch (e) {}\n  }\n\n  next = () => {\n    const bank = this.bank, s = this.state;\n    const q = bank[s.index];\n    if (!q || !this.complete(q, s.answers[q.id])) return;\n    if (s.index < bank.length - 1) {\n      const i = s.index + 1;\n      this.setState({ index: i, nudge: false, hover: null });\n      this.saveProgress(i, s.answers);\n      if (window.PeakSCORM) window.PeakSCORM.bookmark(i);\n      return;\n    }\n    const missing = bank.filter(x => !this.complete(x, s.answers[x.id]));\n    if (missing.length) {\n      this.setState({ index: bank.indexOf(missing[0]), nudge: true, hover: null });\n      return;\n    }\n    this.submit();\n  };\n\n  submit() {\n    const bank = this.bank, answers = this.state.answers;\n    const items = bank.map(q => {\n      const chosen = (answers[q.id] || []).slice().sort();\n      const key = q.correct.slice().sort();\n      return {\n        id: q.id, stem: q.stem, domain: q.domain,\n        chosen: chosen.join(','), correct: key.join(','),\n        isCorrect: chosen.length === key.length && chosen.every((l, i) => l === key[i])\n      };\n    });\n    const correct = items.filter(i => i.isCorrect).length;\n    const percent = Math.round((correct / bank.length) * 100);\n    const learner = { name: this.state.learnerName || '', program: this.program };\n    let lms = this.state.lms;\n    try {\n      if (window.PeakSCORM) {\n        const r = window.PeakSCORM.report({ percent, items, learner });\n        lms = { connected: r.lms, version: r.version };\n      }\n    } catch (e) { lms = { connected: false, version: 'none' }; }\n    try {\n      localStorage.setItem(STORE, JSON.stringify({\n        submitted: true, learner, percent, correct, total: bank.length, at: new Date().toISOString()\n      }));\n      localStorage.removeItem(STORE + ':progress');\n    } catch (e) { /* storage unavailable — SCORM still holds the record */ }\n    this.setState({ screen: 'results', result: { percent, correct, total: bank.length }, lms });\n  }\n\n  doExit = () => { location.reload(); return;\n    if (window.PeakSCORM && window.PeakSCORM.finish) window.PeakSCORM.finish();\n    this.setState({ exited: true });\n    try { window.top.close(); } catch (e) {}\n    try { window.close(); } catch (e) {}\n  };\n\n  doReset = () => {\n    const expected = this.props.instructorPassword || '1d85a508c7b53a2294d5580e513c8011';\n    if (this.state.pw !== expected) { this.setState({ pwError: 'bad' }); return; }\n    try {\n      localStorage.removeItem(STORE);\n      localStorage.removeItem(STORE + ':progress');\n    } catch (e) {}\n    if (window.PeakSCORM) window.PeakSCORM.clear();\n    this._order = null;\n    this.setState({ screen: 'intro', index: 0, answers: {}, result: null, resetOpen: false, pw: '', pwError: '', nudge: false });\n  };\n\n  band(pct) {\n    if (pct >= 80) return 'You are already answering at the level the exam asks for. Use the course to close the last gaps and to drill pacing — consistency is what the exam rewards.';\n    if (pct >= 60) return 'You have real working knowledge to build on. The lessons ahead will sharpen the judgment calls — the questions where two answers both look defensible — which is where most points are won.';\n    if (pct >= 40) return 'You know parts of the terrain and not others yet. That is exactly what Week 0 is for. Follow the course in order and this number moves a long way by the final check.';\n    return 'A low baseline is not a verdict, most learners start here, and it is the cleanest point to measure growth from. Work through the videos in sequence and trust the process.';\n  }\n\n  renderVals() {\n    const s = this.state, bank = this.bank;\n    const total = bank.length || 20;\n    const q = bank[s.index] || { stem: '', options: [], type: 'MC', correct: [] };\n    const picked = s.answers[q.id] || [];\n    const answered = bank.filter(x => this.complete(x, s.answers[x.id])).length;\n    const lastQ = s.index >= total - 1;\n    const ready = this.complete(q, picked);\n    const missing = bank.filter(x => !this.complete(x, s.answers[x.id]));\n    const res = s.result || { percent: 0, correct: 0, total: total };\n    const HOVER_BG = 'rgba(20,24,27,0.06)';\n\n    return {\n      introCopy: this.program === 'CAPM'\n        ? 'Twenty exam-style questions mapped to the CAPM® Exam Content Outline. It is not graded against you — it shows your instructor where to spend the next eight weeks.'\n        : 'Twenty exam-style questions mapped to the July 2026 PMP® Exam Content Outline. It is not graded against you — it shows your instructor where to spend the next eight weeks.',\n\n      isIntro: s.screen === 'intro',\n      isQuiz: s.screen === 'quiz',\n      isResults: s.screen === 'results',\n      doExit: this.doExit,\n      start: this.start,\n\n      total: total,\n      humanIndex: s.index + 1,\n      answeredCount: answered,\n      q: q,\n      isMulti: q.type === 'MR',\n      multiLabel: q.pickCount ? 'Choose ' + q.pickCount : 'Select all that apply',\n      segments: bank.map((x, i) => ({\n        bg: i === s.index ? '#E3635C' : (this.complete(x, s.answers[x.id]) ? 'rgba(227,99,92,0.42)' : 'rgba(20,24,27,0.14)')\n      })),\n      choices: (q.options || []).map(o => {\n        const on = picked.includes(o.letter);\n        const hot = s.hover === o.letter && !on;\n        return {\n          letter: o.letter,\n          label: o.text,\n          bg: on ? 'rgba(20,24,27,0.05)' : (hot ? HOVER_BG : '#FFFFFF'),\n          border: on ? INK : (hot ? 'rgba(20,24,27,0.32)' : 'rgba(20,24,27,0.16)'),\n          badgeBg: on ? INK : 'transparent',\n          badgeColor: on ? '#FFFFFF' : 'rgba(20,24,27,0.7)',\n          badgeBorder: on ? INK : 'rgba(20,24,27,0.28)',\n          badgeRadius: '2px',\n          pick: () => this.pick(q, o.letter),\n          key: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.pick(q, o.letter); } },\n          enter: () => this.setState({ hover: o.letter }),\n          leave: () => this.setState(st => (st.hover === o.letter ? { hover: null } : null))\n        };\n      }),\n\n      back: this.back,\n      backColor: s.index === 0 ? 'rgba(20,24,27,0.26)' : 'rgba(20,24,27,0.8)',\n      backCursor: s.index === 0 ? 'default' : 'pointer',\n      next: this.next,\n      nextLabel: lastQ ? 'Submit baseline' : 'Next question',\n      nextBg: ready ? INK : 'rgba(20,24,27,0.14)',\n      nextInk: ready ? '#FFFFFF' : 'rgba(20,24,27,0.4)',\n      nextCursor: ready ? 'pointer' : 'default',\n      unansweredNote: s.nudge && missing.length\n        ? missing.length + ' question' + (missing.length > 1 ? 's' : '') + ' still need an answer.'\n        : '',\n\n      solidIn: e => { if (e.currentTarget.style.cursor !== 'default') e.currentTarget.style.background = '#4A5560'; },\n      solidOut: e => { e.currentTarget.style.background = e.currentTarget.style.cursor === 'default' ? 'rgba(20,24,27,0.14)' : INK; },\n      ghostIn: e => { if (e.currentTarget.style.cursor === 'pointer') e.currentTarget.style.background = HOVER_BG; },\n      ghostOut: e => { e.currentTarget.style.background = 'transparent'; },\n\n      percentLabel: res.percent + '%',\n      bandCopy: this.band(res.percent),\n\n      resetOpen: s.resetOpen,\n      toggleReset: () => this.setState(st => ({ resetOpen: !st.resetOpen, pw: '', pwError: '' })),\n      closeReset: () => this.setState({ resetOpen: false, pw: '', pwError: '' }),\n      pw: s.pw,\n      pwBorder: s.pwError ? 'var(--peak-red)' : 'rgba(255,255,255,0.25)',\n      onPw: e => this.setState({ pw: e.target.value, pwError: '' }),\n      pwKey: e => { if (e.key === 'Enter') this.doReset(); if (e.key === 'Escape') this.setState({ resetOpen: false, pw: '', pwError: '' }); },\n      doReset: this.doReset\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
